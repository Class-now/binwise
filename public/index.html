<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="BinWise Tokyo: snap an item and learn how Shibuya, Shinjuku or Setagaya wants it thrown away." />
    <title>BinWise Tokyo</title>
    <style>
      :root {
        --bg: #f6f7f4; --fg: #1b1e1c; --muted: #5c625e; --card: #ffffff; --line: #d9ddd8;
        --accent: #1f7a4d; --accent-fg: #ffffff; --ok: #1f7a4d; --bad: #b42318; --focus: #1c6dd0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121513; --fg: #e8ece9; --muted: #a3aba6; --card: #1c211e; --line: #333a36;
          --accent: #4cc38a; --accent-fg: #0b1a12; --ok: #4cc38a; --bad: #ff8a80; --focus: #8ab4f8;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans", sans-serif; background: var(--bg); color: var(--fg); }
      header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: var(--card); }
      header h1 { font-size: 1.15rem; margin: 0; }
      header .ward { font-size: .85rem; color: var(--muted); }
      main { max-width: 44rem; margin: 0 auto; padding: 1rem; }
      h2 { font-size: 1.2rem; margin: 1rem 0 .5rem; }
      h3 { font-size: 1.05rem; margin: .25rem 0; }
      p { margin: .4rem 0; }
      a { color: var(--accent); }
      .muted { color: var(--muted); font-size: .9rem; }
      button, select, input[type="search"] { font: inherit; color: inherit; }
      button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: .6rem; padding: .55rem .9rem; min-height: 44px; }
      button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
      button.link { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: .25rem; min-height: 0; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      select, input[type="search"] { width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: .6rem; background: var(--card); min-height: 44px; }
      label { display: block; font-weight: 600; margin: .75rem 0 .3rem; }
      fieldset { border: 1px solid var(--line); border-radius: .75rem; padding: .5rem .75rem .75rem; margin: .75rem 0; }
      legend { font-weight: 600; padding: 0 .3rem; }
      .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
      .chip { position: relative; }
      .chip input { position: absolute; opacity: 0; inset: 0; }
      .chip span { display: inline-block; min-width: 2.6rem; text-align: center; padding: .4rem .55rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
      .chip input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
      .chip input:checked + span::before { content: "✓ "; }
      .chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
      .sub { font-size: .85rem; color: var(--muted); margin-top: .4rem; }
      .snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; width: 100%; min-height: 7rem; font-size: 1.3rem; border-radius: 1rem; }
      .snap .icon { font-size: 2rem; }
      .snap small { font-size: .85rem; font-weight: 400; }
      .search-row { display: flex; gap: .5rem; }
      .search-row input { flex: 1; }
      .recent { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
      .recent button { min-height: 36px; padding: .25rem .7rem; font-size: .9rem; border-radius: 999px; }
      .impact { margin: 1rem 0; padding: .6rem .8rem; border-radius: .75rem; background: var(--card); border: 1px solid var(--line); font-size: .95rem; }
      .status { min-height: 1.5rem; margin: .75rem 0; }
      .result { margin: 1rem 0 1.5rem; }
      .cards { display: grid; gap: .6rem; }
      .part-card { background: var(--card); border: 1px solid var(--line); border-left: 10px solid var(--cat, var(--line)); border-radius: .75rem; padding: .7rem .85rem; }
      .part-card .cat { display: flex; align-items: center; gap: .45rem; font-weight: 700; font-size: 1.05rem; }
      .part-card .cat .icon { font-size: 1.4rem; }
      .part-card .part { font-size: .9rem; color: var(--muted); }
      .part-card .next { font-weight: 600; }
      .box { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: .7rem .85rem; margin-top: .6rem; }
      .box ul { margin: .25rem 0; padding-left: 0; list-style: none; }
      .box li label { display: flex; gap: .5rem; align-items: flex-start; font-weight: 400; margin: .25rem 0; }
      .box li input { width: 1.2rem; height: 1.2rem; margin-top: .2rem; flex: none; }
      .mistake { border-color: var(--bad); }
      details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
      .trace { font: .85rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      .alts { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
      .quiz-options { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; margin: .75rem 0; }
      .quiz-options button { text-align: left; display: flex; align-items: center; gap: .4rem; }
      .quiz-options button.right { border: 3px solid var(--ok); }
      .quiz-options button.right::after { content: " ✓"; font-weight: 700; color: var(--ok); }
      .quiz-options button.picked-wrong { border: 3px solid var(--bad); }
      .quiz-options button.picked-wrong::after { content: " ✗"; font-weight: 700; color: var(--bad); }
      .quiz-item { font-size: 1.5rem; font-weight: 700; margin: .5rem 0; }
      .feedback.ok { color: var(--ok); font-weight: 700; }
      .feedback.bad { color: var(--bad); font-weight: 700; }
      .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      footer { max-width: 44rem; margin: 2rem auto; padding: 0 1rem 2rem; }
      [hidden] { display: none !important; }
      @media (max-width: 400px) { .quiz-options { grid-template-columns: 1fr; } main { padding: .75rem; } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>♻️ BinWise Tokyo</h1>
        <div class="ward" id="ward-name"></div>
      </div>
      <button type="button" id="open-settings" hidden></button>
    </header>
    <main>
      <p id="tagline" class="muted"></p>

      <section id="setup" hidden aria-labelledby="setup-title">
        <h2 id="setup-title"></h2>
        <form id="setup-form">
          <label for="ward-select" id="ward-label"></label>
          <select id="ward-select" name="ward">
            <option value="shibuya">Shibuya · 渋谷区</option>
            <option value="shinjuku">Shinjuku · 新宿区</option>
            <option value="setagaya">Setagaya · 世田谷区</option>
          </select>
          <label for="language-select" id="language-label"></label>
          <select id="language-select" name="language"></select>
          <fieldset>
            <legend id="days-title"></legend>
            <p class="muted" id="days-help"></p>
            <div id="area-wrap" hidden>
              <label for="area-select" id="area-label"></label>
              <select id="area-select"></select>
            </div>
            <div id="day-groups"></div>
          </fieldset>
          <button type="submit" class="primary" id="save-setup"></button>
        </form>
      </section>

      <section id="search" hidden>
        <input type="file" id="photo" accept="image/*" capture="environment" class="sr-only" tabindex="-1" aria-hidden="true" />
        <button type="button" class="primary snap" id="snap"></button>
        <form id="search-form" role="search">
          <label for="query" id="query-label"></label>
          <div class="search-row">
            <input type="search" id="query" list="item-names" autocomplete="off" maxlength="200" />
            <button type="submit" id="search-button"></button>
          </div>
          <datalist id="item-names"></datalist>
        </form>
        <div id="recent-wrap" hidden>
          <h2 class="sr-only" id="recent-title"></h2>
          <div class="recent" id="recent"></div>
        </div>
        <div class="actions"><button type="button" id="start-quiz"></button></div>
        <p class="impact" id="impact" aria-live="polite"></p>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div id="results"></div>
      </section>

      <section id="quiz" hidden aria-labelledby="quiz-title">
        <h2 id="quiz-title"></h2>
        <div id="quiz-body"></div>
      </section>
    </main>
    <footer class="muted" id="footer"></footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
